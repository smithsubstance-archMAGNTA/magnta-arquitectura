version: '3.8'

services:
  web:
    build: .
    container_name: magnta_web
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://magnta:magnta_pass@db:5432/magnta
    volumes:
      - ./:/app
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: magnta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: magnta
      POSTGRES_PASSWORD: magnta_pass
      POSTGRES_DB: magnta
    volumes:
      - pgdata:/var/lib/postgresql/data

  simulator:
    build: .
    container_name: magnta_simulator
    depends_on:
      - web
    environment:
      - SIM_TARGET=http://web:8000/ingest-signal
      - SIM_INTERVAL=5
      - SIM_SOURCE=sim-1
    command: ["python", "/app/scripts/simulator.py"]
    restart: unless-stopped

volumes:
  pgdata:
